    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;

  html, body { margin: 0; padding: 0; }

  /* ============ sidebar ============ */
  .side {

    padding: 20px 12px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
  .brand-sub { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .nav-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 12px 10px 6px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-align: left;
  }
  .nav-btn svg { flex: none; opacity: .75; }
  .nav-btn:hover { background: var(--accent-soft); color: var(--ink); }
  .nav-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-btn.on svg { opacity: 1; }
  .side-foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--grid); font-size: 11.5px; color: var(--ink-3); }
  .side-foot strong { color: var(--ink-2); }

  /* ============ main ============ */
  .main { min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 28px; border-bottom: 1px solid var(--grid);
    background: var(--surface); position: sticky; top: 0; z-index: 20;
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .topbar .crumb { color: var(--ink-3); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--grid); color: var(--ink-2); background: var(--surface);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }

  .content { padding: 24px 28px 60px; max-width: 1240px; }
  .view { display: none; }
  .view.on { display: block; }
  .view-head { margin: 2px 0 18px; }
  .view-head h2 { font-size: 20px; margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .view-head p { margin: 0; color: var(--ink-2); max-width: 68ch; }

  .grid { display: grid; gap: 14px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  .cols-4 { grid-template-columns: repeat(4, 1fr); }
  .span-2 { grid-column: span 2; }
  @media (max-width: 1000px) { .cols-4 { grid-template-columns: 1fr 1fr; } .cols-3 { grid-template-columns: 1fr; } }
  @media (max-width: 760px)  { .cols-2, .cols-4 { grid-template-columns: 1fr; } .span-2 { grid-column: auto; } }

  .card {
    background: var(--surface); border: 1px solid var(--grid);
    border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow);
    min-width: 0;
  }
  .card h3 { font-size: 13px; margin: 0 0 2px; font-weight: 650; }
  .card .sub { font-size: 12px; color: var(--ink-3); margin: 0 0 12px; }

  /* stat tiles */
  .stat .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .stat .num { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
  .stat .delta { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .up { color: var(--good-text); font-weight: 600; }
  .down { color: var(--crit); font-weight: 600; }

  .progress { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; margin-top: 10px; }
  .progress > span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .progress > span.g { background: var(--good); }
  .progress > span.w { background: var(--warn); }

  /* status pills */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;

    box-shadow: var(--shadow); max-width: 260px;

  /* filters row */

  .filters input[type="search"] { min-width: 200px; flex: 1; max-width: 320px; }

  /* kanban strip */

  .stage-card .v { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* drawer */

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); z-index: 41;
    background: var(--surface); border-left: 1px solid var(--grid);
    padding: 22px; overflow-y: auto; transform: translateX(102%); transition: transform .22s ease;
  }
  .drawer.open { transform: none; }

  /* callouts */
  .callout {
    border: 1px solid var(--grid); border-left: 3px solid var(--crit);

  .callout p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

  .f-row { display: grid; grid-template-columns: 108px 1fr 120px; gap: 12px; align-items: center; }

  .f-bar { height: 100%; border-radius: 4px; min-width: 4px; }
  .f-row .val { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .f-conv { font-size: 11px; color: var(--ink-3); padding-left: 120px; }

  /* scenario toggle */
  .seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; }
  .seg button { padding: 6px 14px; font-size: 12.5px; color: var(--ink-2); }

    .topbar { padding: 12px 14px; }
  }

const $ = (s, r) => (r || document).querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = () => [css('--s1'), css('--s2'), css('--s3'), css('--s4'), css('--s5')];

const fmtM = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
  return '$' + Math.round(n);
};
const fmtFull = n => '$' + Math.round(n).toLocaleString('en-US');
const fmtP = (n, d = 1) => (n * 100).toFixed(d) + '%';
const fmtN = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const monthLabel = m => { const [y, mo] = m.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1] + ' ' + y.slice(2); };

/* tooltip */
const tip = $('#tip');
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function lineChart(opts) {
  // opts: { series: [{name, color, values, fill}], labels, h, fmt, id }
  const W = 640, H = opts.h || 220, padL = 46, padR = 10, padT = 12, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const all = opts.series.flatMap(s => s.values);
  const max = Math.max(...all) * 1.08, min = 0;
  const n = opts.labels.length;
  const X = i => padL + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => padT + ih - (v - min) / (max - min) * ih;
  const fmt = opts.fmt || fmtN;
  const ticks = 4;
  let g = '';
  for (let t = 0; t <= ticks; t++) {
    const v = min + (max - min) * t / ticks, y = Y(v);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  opts.labels.forEach((l, i) => {
    if (i % step === 0 || i === n - 1)
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${l}</text>`;
  });
  let paths = '';
  opts.series.forEach(s => {
    const pts = s.values.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if (s.fill) {
      paths += `<path d="M${pts.join(' L')} L${X(n - 1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${s.color}" opacity="0.13"/>`;
    }
    paths += `<path d="M${pts.join(' L')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length - 1;
    paths += `<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  const id = opts.id;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'line chart')}" data-line="${id}">
    ${g}${paths}
    <line data-cross x1="0" y1="${padT}" x2="0" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>
    <rect data-hit x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
  requestAnimationFrame(() => {
    const el = document.querySelector(`svg[data-line="${id}"]`); if (!el) return;
    const hit = el.querySelector('[data-hit]'), cross = el.querySelector('[data-cross]');
    hit.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      const sx = W / r.width;
      const px = (e.clientX - r.left) * sx;
      let i = Math.round((px - padL) / (iw / (n - 1)));
      i = Math.max(0, Math.min(n - 1, i));
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
      cross.style.display = '';
      const rows = opts.series.map(s =>
        `<div><span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${fmt(s.values[i])}</b></div>`).join('');
      showTip(e, `<div style="opacity:.75;margin-bottom:2px">${opts.labels[i]}</div>${rows}`);
    });
    hit.addEventListener('mouseleave', () => { cross.style.display = 'none'; hideTip(); });
  });
  return `<div class="chart">${svg}</div>`;
}

function barChart(opts) {
  // opts: { labels, values, color | colors, h, fmt, id, aria, tipRows }
  const W = 640, H = opts.h || 220, padL = 46, padR = 10, padT = 12, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(...opts.values) * 1.08;
  const n = opts.values.length;
  const slot = iw / n, bw = Math.min(slot * 0.6, 46);
  const fmt = opts.fmt || fmtN;
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const v = max * t / 4, y = padT + ih - v / max * ih;
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 10));
  let bars = '';
  opts.values.forEach((v, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    const h = Math.max(v / max * ih, 2), y = padT + ih - h;
    const c = opts.colors ? opts.colors[i] : (opts.color || 'var(--s1)');
    bars += `<path data-i="${i}" d="M${x},${y + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${padT + ih} H${x} Z" fill="${c}"/>`;
    if (i % step === 0 || i === n - 1)
      g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${opts.labels[i]}</text>`;
  });
  const id = opts.id;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'bar chart')}" data-bar="${id}">${g}${bars}</svg>`;
  requestAnimationFrame(() => {
    const el = document.querySelector(`svg[data-bar="${id}"]`); if (!el) return;
    el.querySelectorAll('path[data-i]').forEach(p => {
      const i = +p.dataset.i;
      p.addEventListener('mousemove', e => showTip(e,
        opts.tipRows ? opts.tipRows(i) :
        `<div style="opacity:.75">${opts.labels[i]}</div><b>${fmt(opts.values[i])}</b>`));
      p.addEventListener('mouseleave', hideTip);
    });
  });
  return `<div class="chart">${svg}</div>`;
}

function hbarChart(opts) {
  // horizontal bars: { rows: [{label, value, right, color}], fmt, id }
  const max = Math.max(...opts.rows.map(r => r.value));
  return `<div class="funnel">` + opts.rows.map((r, i) => `
    <div class="f-row" data-hb="${opts.id}:${i}">
      <div class="name">${esc(r.label)}</div>
      <div class="f-bar-track"><div class="f-bar" style="width:${Math.max(r.value / max * 100, 1.2)}%;background:${r.color || 'var(--s1)'}"></div></div>
      <div class="val">${r.right}</div>
    </div>`).join('') + `</div>`;
}

function donutChart(opts) {
  // { items: [{label, value, color}], id, fmt }
  const total = opts.items.reduce((a, b) => a + b.value, 0);
  const R = 70, r = 44, CX = 90, CY = 90;
  let a0 = -Math.PI / 2, segs = '';
  opts.items.forEach((it, idx) => {
    const a1 = a0 + it.value / total * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const gap = 0.018;
    const s0 = a0 + gap, s1 = a1 - gap;
    const p = (a, rad) => `${(CX + Math.cos(a) * rad).toFixed(1)},${(CY + Math.sin(a) * rad).toFixed(1)}`;
    segs += `<path data-i="${idx}" d="M${p(s0, R)} A${R},${R} 0 ${large} 1 ${p(s1, R)} L${p(s1, r)} A${r},${r} 0 ${large} 0 ${p(s0, r)} Z" fill="${it.color}"/>`;
    a0 = a1;
  });
  const fmt = opts.fmt || fmtM;
  const svg = `<svg viewBox="0 0 180 180" style="max-width:210px;margin:0 auto" role="img" aria-label="${esc(opts.aria || 'donut chart')}" data-donut="${opts.id}">
    ${segs}
    <text x="${CX}" y="${CY - 4}" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${fmt(total)}</text>
    <text x="${CX}" y="${CY + 14}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">TOTAL / MO</text>
  </svg>`;
  requestAnimationFrame(() => {
    const el = document.querySelector(`svg[data-donut="${opts.id}"]`); if (!el) return;
    el.querySelectorAll('path[data-i]').forEach(p => {
      const it = opts.items[+p.dataset.i];
      p.addEventListener('mousemove', e => showTip(e,
        `<div style="opacity:.75">${esc(it.label)}</div><b>${fmt(it.value)}</b> · ${fmtP(it.value / total, 0)} of budget`));
      p.addEventListener('mouseleave', hideTip);
    });
  });
  return `<div class="chart">${svg}</div>`;
}

function legend(items) {
  return `<div class="legend">` + items.map(i =>
    `<span class="key"><span class="swatch" style="background:${i.color}"></span>${esc(i.label)}</span>`).join('') + `</div>`;
}

function uniq(k) { return [...new Set(L.map(l => l[k]))].sort(); }

        <tbody id="pipe-body"></tbody>
      </table>

function stagePill(s) {
  if (s === 'Closed-Won') return `<span class="pill good">${ICON.check}Won</span>`;
  if (s === 'Closed-Lost') return `<span class="pill" style="color:var(--ink-3);background:var(--grid)">Lost</span>`;
  if (s === 'Opportunity') return `<span class="pill info">Opportunity</span>`;
  return `<span class="pill" style="color:var(--ink-2);background:var(--accent-soft)">${esc(s)}</span>`;
}

function renderPipeRows() {
  const st = pipeState;
  let rows = L.filter(l =>
    (st.stage === 'All' || l.stage === st.stage) &&
    (st.source === 'All' || l.source === st.source) &&
    (st.rep === 'All' || l.rep === st.rep) &&
    (st.tier === 'All' || l.tier === st.tier) &&
    (!st.q || (l.company + ' ' + l.id + ' ' + l.industry).toLowerCase().includes(st.q))
  );
  rows.sort((a, b) => {
    const k = st.sort;
    const va = k === 'date' ? a.date : a[k], vb = k === 'date' ? b.date : b[k];
    return (va > vb ? 1 : va < vb ? -1 : 0) * st.dir;
  });
  const body = $('#pipe-body'); if (!body) return;
  body.innerHTML = rows.slice(0, 250).map((l, i) => `
    <tr class="clickable" tabindex="0" data-lead="${esc(l.id)}" role="button" aria-label="Open ${esc(l.company)}">
      <td>${l.date}</td><td class="rank">${esc(l.id)}</td><td><strong>${esc(l.company)}</strong></td>
      <td>${esc(l.industry)}</td><td>${esc(l.size)}</td><td>${esc(l.source)}</td><td>${esc(l.rep)}</td>
      <td>${stagePill(l.stage)}${l.stage === 'Opportunity' && l.cycle > 120 ? ` <span class="pill crit">${ICON.flame}Stale</span>` : ''}</td>
      <td class="num">${fmtFull(l.value)}</td><td class="num">${l.cycle}d</td>
    </tr>`).join('');
  $('#pipe-count').textContent = rows.length + ' of ' + L.length + ' leads · ' + fmtM(rows.reduce((a, l) => a + l.value, 0)) + ' total ARR in view';
  body.querySelectorAll('tr[data-lead]').forEach(tr => {
    const open = () => openDrawer(tr.dataset.lead);
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
}

function bindPipeline() {
  const bind = (id, key) => { const el = $('#' + id); if (el) el.addEventListener('change', () => { pipeState[key] = el.value; renderPipeRows(); }); };
  bind('pf-stage', 'stage'); bind('pf-source', 'source'); bind('pf-rep', 'rep'); bind('pf-tier', 'tier');
  const q = $('#pf-q'); if (q) q.addEventListener('input', () => { pipeState.q = q.value.trim().toLowerCase(); renderPipeRows(); });
  document.querySelectorAll('#pipe-table th[data-s]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.s;
    if (pipeState.sort === k) pipeState.dir *= -1; else { pipeState.sort = k; pipeState.dir = -1; }
    renderPipeRows();
  }));
  renderPipeRows();
}

function openDrawer(id) {
  const l = L.find(x => x.id === id); if (!l) return;
  const d = $('#drawer');
  const wonDeal = l.stage === 'Closed-Won';
  d.innerHTML = `
    <button class="close" id="drawer-close" aria-label="Close">✕</button>
    <h3>${esc(l.company)}</h3>
    <p class="note">${esc(l.id)} · entered ${l.date}</p>
    <div style="margin:10px 0">${stagePill(l.stage)} ${l.stage === 'Opportunity' && l.cycle > 120 ? `<span class="pill crit">${ICON.flame}${l.cycle} days in cycle — act now</span>` : ''}</div>
    <div class="card" style="padding:12px 14px;margin:12px 0">
      <div class="stat"><div class="label">Deal value (ARR)</div><div class="num" style="font-size:23px">${fmtFull(l.value)}</div></div>
      ${wonDeal ? `<p class="note">Closed ${l.closeDate} after a ${l.cycle}-day cycle</p>` : `<p class="note">${l.cycle} days in cycle · segment average is ${l.size === 'SMB' ? '33' : l.size === 'Mid-Market' ? '69' : '138'} days</p>`}
    </div>
    <dl class="kv">
      <dt>Industry</dt><dd>${esc(l.industry)}</dd>
      <dt>Company size</dt><dd>${esc(l.size)}</dd>
      <dt>Lead source</dt><dd>${esc(l.source)}</dd>
      <dt>Sales rep</dt><dd>${esc(l.rep)}</dd>
      <dt>Product tier</dt><dd>${esc(l.tier)}</dd>
      <dt>Contract</dt><dd>${esc(l.contract)}</dd>
      <dt>Sales cycle</dt><dd>${l.cycle} days</dd>
      ${l.closeDate ? `<dt>Close date</dt><dd>${l.closeDate}</dd>` : ''}
    </dl>`;
  $('#scrim').classList.add('open'); d.classList.add('open');
  $('#drawer-close').addEventListener('click', closeDrawer);
  $('#drawer-close').focus();
}
function closeDrawer() { $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); }
$('#scrim').addEventListener('click', closeDrawer);

        return `<div style="opacity:.75">${r[0]}</div><b>${fmtFull(r[1])}</b>` + (prev ? `<div>${d >= 0 ? '↑' : '↓'} ${fmtP(Math.abs(d))} vs prior month</div>` : ''); } })}
    <p class="axis-note">Dips in Jul 2024, Jan 2025 and Jul 2025 track the seasonality index — not a demand problem.</p>
  </div>

}

function scenarioBody() {

    ${statTile('Vs 10/day target', '', s.status === 'On target' ? pillOk(s.status) : pillWarn(s.status))}

}
function bindMedia() {
  const seg = $('#scen'); if (!seg) return;
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    scenarioKey = b.dataset.k;
    seg.querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    $('#scen-body').innerHTML = scenarioBody();
  }));
}

/* ============================== router ============================== */
const VIEWS = {
  dashboard: { render: viewDashboard },
  pipeline: { render: viewPipeline, bind: bindPipeline },
  marketing: { render: viewMarketing },
  analytics: { render: viewAnalytics },
  forecast: { render: viewForecast },
  compare: { render: viewCompare },
  media: { render: viewMedia, bind: bindMedia },
  reports: { render: viewReports },
};
let current = 'dashboard';
function go(id) {
  current = id;
  const m = MODULES.find(x => x.id === id);
  $('#page-title').textContent = m.name;
  $('#page-crumb').textContent = m.crumb;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  const c = $('#content');
  c.innerHTML = `<section class="view on">${VIEWS[id].render()}</section>`;
  if (VIEWS[id].bind) VIEWS[id].bind();
  closeDrawer(); hideTip();
  window.scrollTo({ top: 0 });
  location.hash = id;
}
$('#nav').innerHTML = MODULES.map(m =>
  `<button class="nav-btn" data-id="${m.id}">${NAV_ICONS[m.icon]}<span>${m.name}</span></button>`).join('');
document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => go(b.dataset.id)));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => go(current));
new MutationObserver(muts => { if (muts.some(m => m.attributeName === 'data-theme')) go(current); })
  .observe(document.documentElement, { attributes: true });
go(MODULES.some(m => m.id === location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard');
</script>
